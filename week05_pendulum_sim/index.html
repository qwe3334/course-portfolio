<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双摆混沌仿真 — 李雨婷 7905126041</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #c8c8d4;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 10px;
    color: #e0e0f0;
  }
  canvas {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(100, 140, 255, 0.08);
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  .panel {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    font-size: 0.82rem;
    color: #8888a0;
    flex-wrap: wrap;
    justify-content: center;
  }
  .panel span { color: #a0a0ff; font-weight: 600; font-variant-numeric: tabular-nums; }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: rgba(100, 140, 255, 0.12);
    border: 1px solid rgba(100, 140, 255, 0.25);
    color: #c0c0e0;
    padding: 5px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
    transition: background 0.2s;
  }
  button:hover { background: rgba(100, 140, 255, 0.25); }
  .hint {
    margin-top: 8px;
    font-size: 0.75rem;
    color: #5a5a70;
  }
</style>
</head>
<body>

<h1>双摆混沌仿真 (Double Pendulum)</h1>
<canvas id="canvas"></canvas>
<div class="panel">
  <div>θ₁: <span id="a1Display">120.0°</span></div>
  <div>θ₂: <span id="a2Display">120.0°</span></div>
  <div>能量: <span id="energyDisplay">—</span></div>
  <div>时间: <span id="timeDisplay">0.00 s</span></div>
</div>
<div class="controls">
  <button id="btnReset">重置</button>
  <button id="btnPause">暂停</button>
  <button id="btnClearTrail">清除拖尾</button>
</div>
<div class="hint">拖拽摆球设定初始角度 · 释放后开始仿真</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = 700, H = 560;
canvas.width = W;
canvas.height = H;

const g = 9.8;
const m1 = 10, m2 = 10;
let L1 = 140, L2 = 140;
const pivotX = W / 2, pivotY = 160;
const bobR = 14;
const trailMax = 600;

const DEG = Math.PI / 180;
let state = { a1: 120 * DEG, w1: 0, a2: 120 * DEG, w2: 0 };
let time = 0;
let paused = false;
let trail = [];

let dragging = null;

function accel(a1, w1, a2, w2) {
  const da = a1 - a2;
  const sinDa = Math.sin(da), cosDa = Math.cos(da);
  const sin1 = Math.sin(a1), cos1 = Math.cos(a1);
  const M = m1 + m2;
  const denom = 2 * M - 2 * m2 * cosDa * cosDa;

  const dw1 = (-g * (2 * m1 + m2) * sin1
    - m2 * g * Math.sin(a1 - 2 * a2)
    - 2 * sinDa * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * cosDa))
    / (L1 * denom);

  const dw2 = (2 * sinDa * (w1 * w1 * L1 * M
    + g * M * cos1
    + w2 * w2 * L2 * m2 * cosDa))
    / (L2 * denom);

  return [w1, dw1, w2, dw2];
}

function rk4Step(s, dt) {
  const k1 = accel(s.a1, s.w1, s.a2, s.w2);
  const s2 = {
    a1: s.a1 + k1[0] * dt / 2, w1: s.w1 + k1[1] * dt / 2,
    a2: s.a2 + k1[2] * dt / 2, w2: s.w2 + k1[3] * dt / 2
  };
  const k2 = accel(s2.a1, s2.w1, s2.a2, s2.w2);
  const s3 = {
    a1: s.a1 + k2[0] * dt / 2, w1: s.w1 + k2[1] * dt / 2,
    a2: s.a2 + k2[2] * dt / 2, w2: s.w2 + k2[3] * dt / 2
  };
  const k3 = accel(s3.a1, s3.w1, s3.a2, s3.w2);
  const s4 = {
    a1: s.a1 + k3[0] * dt, w1: s.w1 + k3[1] * dt,
    a2: s.a2 + k3[2] * dt, w2: s.w2 + k3[3] * dt
  };
  const k4 = accel(s4.a1, s4.w1, s4.a2, s4.w2);

  return {
    a1: s.a1 + (k1[0] + 2*k2[0] + 2*k3[0] + k4[0]) * dt / 6,
    w1: s.w1 + (k1[1] + 2*k2[1] + 2*k3[1] + k4[1]) * dt / 6,
    a2: s.a2 + (k1[2] + 2*k2[2] + 2*k3[2] + k4[2]) * dt / 6,
    w2: s.w2 + (k1[3] + 2*k2[3] + 2*k3[3] + k4[3]) * dt / 6
  };
}

function totalEnergy() {
  const { a1, w1, a2, w2 } = state;
  const c1 = Math.cos(a1), c2 = Math.cos(a2);
  const cd = Math.cos(a1 - a2);
  const ke = 0.5 * m1 * L1*L1 * w1*w1
    + 0.5 * m2 * (L1*L1 * w1*w1 + L2*L2 * w2*w2 + 2*L1*L2*w1*w2*cd);
  const pe = -(m1 + m2) * g * L1 * c1 - m2 * g * L2 * c2;
  return ke + pe;
}

function bobPos() {
  const { a1, a2 } = state;
  const x1 = pivotX + L1 * Math.sin(a1);
  const y1 = pivotY + L1 * Math.cos(a1);
  const x2 = x1 + L2 * Math.sin(a2);
  const y2 = y1 + L2 * Math.cos(a2);
  return { x1, y1, x2, y2 };
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const { x1, y1, x2, y2 } = bobPos();

  for (let i = 1; i < trail.length; i++) {
    const t = trail[i];
    const frac = i / trail.length;
    const hue = (frac * 300 + time * 40) % 360;
    const alpha = frac * 0.7;
    const r = 1.5 + frac * 3.5;
    ctx.beginPath();
    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
    ctx.fill();
  }

  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = 'rgba(180, 190, 220, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#8888aa';
  ctx.fill();

  drawBob(x1, y1, '#6080cc', '#304880');
  drawBob(x2, y2, '#cc6080', '#803048');
}

function drawBob(x, y, c1, c2) {
  const glow = ctx.createRadialGradient(x, y, bobR * 0.3, x, y, bobR * 3);
  glow.addColorStop(0, 'rgba(120, 160, 255, 0.35)');
  glow.addColorStop(1, 'rgba(60, 100, 255, 0)');
  ctx.beginPath();
  ctx.arc(x, y, bobR * 3, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  const grad = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, bobR);
  grad.addColorStop(0, '#f0f0ff');
  grad.addColorStop(0.5, c1);
  grad.addColorStop(1, c2);
  ctx.beginPath();
  ctx.arc(x, y, bobR, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

function loop() {
  if (!paused && !dragging) {
    const dt = 0.002;
    for (let i = 0; i < 8; i++) {
      state = rk4Step(state, dt);
      time += dt;
    }
    const { x2, y2 } = bobPos();
    trail.push({ x: x2, y: y2 });
    if (trail.length > trailMax) trail.shift();
  }

  draw();
  document.getElementById('a1Display').textContent = (state.a1 / DEG).toFixed(1) + '°';
  document.getElementById('a2Display').textContent = (state.a2 / DEG).toFixed(1) + '°';
  document.getElementById('energyDisplay').textContent = totalEnergy().toFixed(1) + ' J';
  document.getElementById('timeDisplay').textContent = time.toFixed(2) + ' s';
  requestAnimationFrame(loop);
}

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width, sy = H / rect.height;
  return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
}

function hitTest(mx, my) {
  const { x1, y1, x2, y2 } = bobPos();
  if (Math.hypot(mx - x2, my - y2) < bobR + 10) return 2;
  if (Math.hypot(mx - x1, my - y1) < bobR + 10) return 1;
  return 0;
}

canvas.addEventListener('mousedown', e => {
  const hit = hitTest(...Object.values(getMousePos(e)));
  if (hit) { dragging = hit; paused = true; document.getElementById('btnPause').textContent = '继续'; }
});

canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  const { x, y } = getMousePos(e);
  if (dragging === 1) {
    state.a1 = Math.atan2(x - pivotX, y - pivotY);
  } else {
    const { x1, y1 } = bobPos();
    state.a2 = Math.atan2(x - x1, y - y1);
  }
  state.w1 = 0; state.w2 = 0; trail = [];
});

canvas.addEventListener('mouseup', endDrag);
canvas.addEventListener('mouseleave', endDrag);

function endDrag() {
  if (dragging) { dragging = null; time = 0; paused = false; document.getElementById('btnPause').textContent = '暂停'; }
}

document.getElementById('btnReset').addEventListener('click', () => {
  state = { a1: 120 * DEG, w1: 0, a2: 120 * DEG, w2: 0 };
  time = 0; trail = []; paused = false;
  document.getElementById('btnPause').textContent = '暂停';
});

document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? '继续' : '暂停';
});

document.getElementById('btnClearTrail').addEventListener('click', () => { trail = []; });

requestAnimationFrame(loop);
</script>
</body>
</html>
